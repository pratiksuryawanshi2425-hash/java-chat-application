<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java Chat</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
  header { background: #2b5797; color: white; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
  #status { font-size: 13px; }
  #login { margin: 40px auto; background: white; padding: 24px; border-radius: 8px; width: 90%; max-width: 340px; box-shadow: 0 1px 4px #0003; }
  #login input, #login button { width: 100%; padding: 10px; font-size: 16px; margin-top: 10px; }
  #error { color: #c0392b; margin-top: 10px; min-height: 18px; }
  #chat { display: none; flex: 1; min-height: 0; flex-direction: column; }
  #main { display: flex; flex: 1; min-height: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 10px; background: white; }
  #users { width: 120px; overflow-y: auto; padding: 10px; background: #e8ecf1; font-size: 14px; }
  #users h4 { margin: 0 0 6px; }
  .msg { margin: 4px 0; word-wrap: break-word; }
  .time { color: #888; font-size: 12px; }
  .sys { color: #777; font-style: italic; }
  .name { font-weight: bold; color: #2b5797; }
  form { display: flex; padding: 8px; background: #dde2e8; }
  form input { flex: 1; padding: 10px; font-size: 16px; }
  form button { padding: 10px 16px; font-size: 16px; margin-left: 6px; }
</style>
</head>
<body>
<header>
  <strong>Java Chat</strong>
  <span id="status">Not connected</span>
</header>

<div id="login">
  <h3>Join the chat</h3>
  <input id="username" maxlength="20" placeholder="Username" autocomplete="off">
  <button id="joinBtn">Join</button>
  <div id="error"></div>
  <small>1-20 characters: letters, digits, _ and -</small>
</div>

<div id="chat">
  <div id="main">
    <div id="messages"></div>
    <div id="users"><h4>Online</h4><div id="userList"></div></div>
  </div>
  <form id="sendForm">
    <input id="text" maxlength="500" placeholder="Type a message" autocomplete="off">
    <button type="submit">Send</button>
  </form>
</div>

<script>
  var token = null;
  var source = null;

  function $(id) { return document.getElementById(id); }

  function setStatus(text, color) {
    $("status").textContent = text;
    $("status").style.color = color;
  }

  function addMessage(m) {
    var div = document.createElement("div");
    div.className = "msg" + (m.type === "SYSTEM" ? " sys" : "");
    var time = document.createElement("span");
    time.className = "time";
    time.textContent = "[" + m.time + "] ";
    div.appendChild(time);
    if (m.type === "SYSTEM") {
      div.appendChild(document.createTextNode("*** " + m.text + " ***"));
    } else {
      var name = document.createElement("span");
      name.className = "name";
      name.textContent = m.sender + ": ";
      div.appendChild(name);
      div.appendChild(document.createTextNode(m.text));
    }
    var box = $("messages");
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function showUsers(names) {
    var list = $("userList");
    list.textContent = "";
    names.forEach(function (n) {
      var d = document.createElement("div");
      d.textContent = n;
      list.appendChild(d);
    });
  }

  function join() {
    var name = $("username").value.trim();
    $("error").textContent = "";
    fetch("/join", { method: "POST", body: name }).then(function (r) {
      if (!r.ok) {
        return r.text().then(function (t) { $("error").textContent = t; });
      }
      return r.json().then(function (data) {
        token = data.token;
        $("login").style.display = "none";
        $("chat").style.display = "flex";
        openStream();
        $("text").focus();
      });
    }).catch(function () {
      $("error").textContent = "Cannot reach the server.";
    });
  }

  function openStream() {
    source = new EventSource("/events?token=" + encodeURIComponent(token));
    source.onopen = function () { setStatus("Connected", "#7CFC00"); };
    source.onerror = function () { setStatus("Reconnecting...", "orange"); };
    source.addEventListener("message", function (e) { addMessage(JSON.parse(e.data)); });
    source.addEventListener("users", function (e) { showUsers(JSON.parse(e.data)); });
    source.addEventListener("bye", function (e) {
      source.close();
      setStatus("Disconnected", "#ff6b6b");
      addMessage({ type: "SYSTEM", time: "", text: JSON.parse(e.data) });
      token = null;
    });
  }

  function send(event) {
    event.preventDefault();
    var text = $("text").value.trim();
    if (!text || !token) return;
    $("text").value = "";
    fetch("/send?token=" + encodeURIComponent(token), { method: "POST", body: text });
  }

  window.addEventListener("pagehide", function () {
    if (token) navigator.sendBeacon("/leave?token=" + encodeURIComponent(token));
  });

  $("joinBtn").addEventListener("click", join);
  $("username").addEventListener("keydown", function (e) { if (e.key === "Enter") join(); });
  $("sendForm").addEventListener("submit", send);
</script>
</body>
</html>
